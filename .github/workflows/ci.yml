name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查（全项目编译一遍）
        run: python -m compileall -q app.py check.py autostart.py plugins tests mcp_demo

      - name: 插件系统端到端测试
        run: python tests/test_plugins.py

      - name: 工作引擎与身份文件测试
        run: python tests/test_engine.py
